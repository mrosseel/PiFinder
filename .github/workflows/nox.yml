name: nox
# The checks (ruff, mypy, pytest) run inside the flake dev shell, so CI uses
# the same tools and versions as a developer's `nix develop` / `direnv allow`.
# The workflow keeps upstream's "nox" name so PR check wiring stays identical
# across branches.
#
# Both jobs push the dev shell closure to Attic when ATTIC_TOKEN is available
# (pushes and same-repo PRs, not fork PRs). Later runs and developers then
# download the shell instead of compiling libcamera and cedar-detect.
#
# Run on pushes to the long-lived branches and on pull requests. Restricting
# `push` to main/release means a push to a feature branch with an open PR only
# triggers the `pull_request` run (not also a `push` run), so a PR gets a single
# run per push instead of two.
on:
  push:
    branches:
      - main
      - release
  pull_request:
jobs:
  # Tests run on arm64, the same architecture as the PiFinder.
  nox:
    runs-on: ubuntu-24.04-arm
    # A dev shell that is not in Attic compiles libcamera and cedar-detect.
    timeout-minutes: 60
    defaults:
      run:
        shell: nix develop -c bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false
          extra-conf: |
            extra-substituters = https://cache.pifinder.eu/pifinder
            extra-trusted-public-keys = pifinder:8UU/O3oLkaJHHUyqEcPGl+9F1m4MqDca39Ewl49jBmE=
      - name: Build dev shell
        shell: bash
        run: nix build .#devShells.aarch64-linux.default -L --no-link
      - name: Push dev shell to Attic
        shell: bash
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [ -z "$ATTIC_TOKEN" ]; then
            echo "No ATTIC_TOKEN, skipping push"
            exit 0
          fi
          nix profile install nixpkgs#attic-client
          attic login pifinder https://cache.pifinder.eu "$ATTIC_TOKEN"
          attic push pifinder:pifinder \
            "$(nix build .#devShells.aarch64-linux.default --no-link --print-out-paths)"
      # Ruff is pinned to upstream main's noxfile version in pyproject.toml.
      - name: Lint
        run: cd python && ruff check .
      - name: Format check
        run: cd python && ruff format --check .
      - name: Type check
        run: cd python && mypy PiFinder
      - name: Smoke tests
        run: cd python && pytest -m smoke
      - name: Unit tests
        run: cd python && pytest -m unit
      # The web tests need a Selenium grid, which CI does not have.
      - name: Integration tests
        run: cd python && pytest -m integration --ignore-glob='tests/test_web_*'

  # Windows (WSL2) and most Linux developers use the x86_64 dev shell. This job
  # checks that it builds and puts it in Attic. It runs no tests.
  devshell-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false
          extra-conf: |
            extra-substituters = https://cache.pifinder.eu/pifinder
            extra-trusted-public-keys = pifinder:8UU/O3oLkaJHHUyqEcPGl+9F1m4MqDca39Ewl49jBmE=
      - name: Build dev shell
        run: nix build .#devShells.x86_64-linux.default -L --no-link
      - name: Push dev shell to Attic
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [ -z "$ATTIC_TOKEN" ]; then
            echo "No ATTIC_TOKEN, skipping push"
            exit 0
          fi
          nix profile install nixpkgs#attic-client
          attic login pifinder https://cache.pifinder.eu "$ATTIC_TOKEN"
          attic push pifinder:pifinder \
            "$(nix build .#devShells.x86_64-linux.default --no-link --print-out-paths)"
