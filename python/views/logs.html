{% extends "base.html" %}

{% block content %}
<style>
  .log-container {
    background-color: #1e1e1e;
    color: #d4d4d4;
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
    padding: 15px;
    border-radius: 4px;
    height: min(600px, 70vh);
    overflow: auto;
    margin-bottom: 20px;
    position: relative;
    -webkit-overflow-scrolling: touch;
  }
  .log-line {
    margin: 0;
    white-space: pre;
    font-size: 13px;
    line-height: 1.4;
    padding: 1px 0;
    min-height: 20px;
  }
  .log-content {
    width: max-content;
    min-width: 100%;
  }
  .log-line:hover {
    background-color: rgba(255, 255, 255, 0.05);
  }
  .log-line.error { color: #ff6b6b; }
  .log-line.warning { color: #ffd93d; }
  .log-line.info { color: #6bff6b; }
  .log-line.debug { color: #6b6bff; }
  .loading-message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #888;
    font-size: 1.2em;
  }
  .controls {
    margin-bottom: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .controls .btn {
    margin-right: 0;
    white-space: nowrap;
  }
  .controls select {
    height: 36px;
    margin: 0;
    padding: 0 10px;
    width: auto;
    min-width: fit-content;
  }
  .log-stats {
    color: #888;
    font-size: 0.9em;
    margin-bottom: 10px;
  }
  /* Add horizontal scrollbar styles */
  .log-container::-webkit-scrollbar,
  .log-line::-webkit-scrollbar {
    height: 8px;
    width: 8px;
  }
  .log-container::-webkit-scrollbar-track,
  .log-line::-webkit-scrollbar-track {
    background: #2e2e2e;
  }
  .log-container::-webkit-scrollbar-thumb,
  .log-line::-webkit-scrollbar-thumb {
    background: #666;
    border-radius: 4px;
  }
  .log-container::-webkit-scrollbar-thumb:hover,
  .log-line::-webkit-scrollbar-thumb:hover {
    background: #888;
  }
  @media (max-width: 600px) {
    .controls {
      flex-direction: column;
    }
    .controls .btn {
      width: 100%;
      margin-bottom: 5px;
    }
    .log-line {
      font-size: 11px;
    }
  }
</style>

<div class="row valign-wrapper" style="margin: 0px;">
  <div class="col s12">
    <h5 class="grey-text">{{ _('PiFinder Logs') }}</h5>
  </div>
</div>

{% include "_flash.html" %}

<div class="card grey darken-2">
  <div class="card-content">
    <div class="row">
      <div class="col s12">
        <div class="controls">
          <a href="/logs/download" class="btn">
            <i class="material-icons left">download</i>{{ _('Download All Logs') }}
          </a>
          <button id="pauseButton" class="btn">
            <i class="material-icons left">pause</i>{{ _('Pause') }}
          </button>
          <button id="copyButton" class="btn">
            <i class="material-icons left">content_copy</i>{{ _('Copy to Clipboard') }}
          </button>
          <button id="uploadLogConfButton" class="btn" onclick="document.getElementById('uploadLogConfInput').click()">
            <i class="material-icons left">upload_file</i>{{ _('Upload Log Conf') }}
          </button>
          <input type="file" id="uploadLogConfInput" accept=".json" style="display:none">
          <select id="configSelect" class="browser-default">
            <option value="" disabled selected>{{ _('Select Log Configuration') }}</option>
          </select>
        </div>
        <div class="log-stats">
          {{ _('Total lines:') }} <span id="totalLines">0</span>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col s12">
        <div class="log-container" id="logViewer" role="log" aria-live="polite">
          <div id="loadingMessage" class="loading-message">{{ _('Loading log files...') }}</div>
          <div id="logContent" class="log-content"></div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPosition = 0;
let isPaused = false;
let lineCount = 0;
const BUFFER_SIZE = 500;
let pollTimer = null;
const PAUSE_LABEL = '<i class="material-icons left">pause</i>' + {{ _('Pause')|tojson }};
const RESUME_LABEL = '<i class="material-icons left">play_arrow</i>' + {{ _('Resume')|tojson }};

const MIN_POLL_INTERVAL = 1000;
const MAX_POLL_INTERVAL = 10000;
let currentPollInterval = MIN_POLL_INTERVAL;

function scheduleNextFetch(delay) {
    clearTimeout(pollTimer);
    if (!isPaused) {
        pollTimer = setTimeout(fetchLogs, delay);
    }
}

async function fetchLogs() {
    if (isPaused) return;

    try {
        const response = await fetch(`/logs/stream?position=${currentPosition}`);
        const data = await response.json();

        if (data.file_not_found) {
            currentPollInterval = Math.min(currentPollInterval * 2, MAX_POLL_INTERVAL);
            scheduleNextFetch(currentPollInterval);
            return;
        }

        currentPollInterval = MIN_POLL_INTERVAL;

        // Always advance position so we never re-read old data
        if (data.position !== undefined) {
            currentPosition = data.position;
        }

        if (data.logs && data.logs.length > 0) {
            appendLogLines(data.logs);
        }
    } catch (error) {
        console.error('Error fetching logs:', error);
        currentPollInterval = Math.min(currentPollInterval * 2, MAX_POLL_INTERVAL);
    } finally {
        scheduleNextFetch(currentPollInterval);
    }
}

function levelClass(line) {
    if (line.includes('ERROR')) return 'error';
    if (line.includes('WARNING')) return 'warning';
    if (line.includes('INFO')) return 'info';
    if (line.includes('DEBUG')) return 'debug';
    return '';
}

function appendLogLines(lines) {
    const logContent = document.getElementById('logContent');
    const logViewer = document.getElementById('logViewer');
    const fragment = document.createDocumentFragment();
    lines.forEach(line => {
        const logLine = document.createElement('div');
        logLine.className = 'log-line ' + levelClass(line);
        logLine.textContent = line.replace(/\n$/, '');
        fragment.appendChild(logLine);
    });
    logContent.appendChild(fragment);
    lineCount += lines.length;

    // Keep the DOM bounded: drop the oldest lines past the buffer size
    while (logContent.childElementCount > BUFFER_SIZE) {
        logContent.removeChild(logContent.firstElementChild);
    }

    document.getElementById('loadingMessage').style.display = 'none';
    if (!isPaused) {
        logViewer.scrollTop = logViewer.scrollHeight;
    }
    document.getElementById('totalLines').textContent = lineCount;
}

function togglePause() {
    isPaused = !isPaused;
    document.getElementById('pauseButton').innerHTML = isPaused ? RESUME_LABEL : PAUSE_LABEL;
    if (!isPaused) {
        fetchLogs();
    }
}

// Start fetching logs when page loads
document.addEventListener('DOMContentLoaded', () => {
    fetchLogs();
});

window.addEventListener('beforeunload', () => {
    clearTimeout(pollTimer);
});

// Add copy to clipboard functionality
document.getElementById('copyButton').addEventListener('click', function() {
    const logContent = document.getElementById('logContent');
    const text = logContent.innerText;
    const btn = this;
    const originalText = btn.innerHTML;

    const showFeedback = (icon, label) => {
        btn.innerHTML = '<i class="material-icons left">' + icon + '</i>' + label;
        setTimeout(() => { btn.innerHTML = originalText; }, 2000);
    };
    const failedLabel = {{ _('Failed to copy')|tojson }};

    if (!navigator.clipboard) {
        console.error('Clipboard API not available');
        showFeedback('error', failedLabel);
        return;
    }

    navigator.clipboard.writeText(text).then(() => {
        showFeedback('check', {{ _('Copied!')|tojson }});
    }).catch(err => {
        console.error('Failed to copy text: ', err);
        showFeedback('error', failedLabel);
    });
});

// Log configuration management
function loadLogConfigs() {
    fetch('/logs/configs')
        .then(response => response.json())
        .then(data => {
            const configSelect = document.getElementById('configSelect');
            configSelect.innerHTML = '';
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.disabled = true;
            placeholder.textContent = {{ _('Select Log Configuration')|tojson }};
            configSelect.appendChild(placeholder);
            data.configs.forEach(cfg => {
                const option = document.createElement('option');
                option.value = cfg.file;
                option.textContent = cfg.name;
                if (cfg.active) option.selected = true;
                configSelect.appendChild(option);
            });
        })
        .catch(error => console.error('Error fetching log configs:', error));
}

document.getElementById('configSelect').addEventListener('change', function(e) {
    const configFile = e.target.value;
    if (!configFile) return;
    const configName = e.target.options[e.target.selectedIndex].text;
    const question = {{ _('Switch log configuration to "%(name)s" and restart PiFinder?')|tojson }}.replace('%(name)s', configName);
    if (!confirm(question)) {
        loadLogConfigs();
        return;
    }
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = '/logs/switch_config';
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'logconf_file';
    input.value = configFile;
    form.appendChild(input);
    document.body.appendChild(form);
    form.submit();
});

document.getElementById('uploadLogConfInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.name.startsWith('logconf_') || !file.name.endsWith('.json')) {
        alert({{ _('File must be named logconf_<name>.json')|tojson }});
        e.target.value = '';
        return;
    }
    const formData = new FormData();
    formData.append('config_file', file);
    fetch('/logs/upload_config', { method: 'POST', body: formData })
        .then(response => response.json())
        .then(result => {
            if (result.status === 'ok') {
                loadLogConfigs();
            } else {
                alert({{ _('Upload failed:')|tojson }} + ' ' + result.message);
            }
        })
        .catch(error => console.error('Error uploading log config:', error));
    e.target.value = '';
});

// Initial load of configs
loadLogConfigs();

document.getElementById('pauseButton').addEventListener('click', togglePause);
</script>
{% endblock %}
