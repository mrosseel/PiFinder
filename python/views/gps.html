{% extends "base.html" %}

{% block content %}
<div class="row valign-wrapper" style="margin: 0px;">
  <div class="col s12">
        <h5 class="grey-text">{{ _('GPS Settings') }}</h5>
  </div>
</div>
{% include "_flash.html" %}
<div class="card grey darken-2">
  <div class="card-content">
    <form action="/gps/update" method="post" id="gps_form" class="col s12">
        <div class="row">
            <div class="input-field col s12">
                <label>
                    <input type="checkbox" id="formatSwitch" onclick="toggleFormat()"/>
                    <span>{{ _('Use DMS Format') }}</span>
                </label>
            </div>
        </div>
        <div class="row" id="decimalFormat">
            <div class="input-field col s6">
                <input id="latitudeDecimal" type="text" inputmode="decimal" name="latitudeDecimal" value="{% if lat is not none %}{{ lat }}{% endif %}"/>
                <label for="latitudeDecimal">{{ _('Latitude (Decimal)') }}</label>
                <span class="helper-text"></span>
            </div>
            <div class="input-field col s6">
                <input id="longitudeDecimal" type="text" inputmode="decimal" name="longitudeDecimal" value="{% if lon is not none %}{{ lon }}{% endif %}"/>
                <label for="longitudeDecimal">{{ _('Longitude (Decimal)') }}</label>
                <span class="helper-text"></span>
            </div>
        </div>
        <div class="row" id="dmsFormat" style="display:none;">
            <div class="input-field col s4">
                <input id="latitudeD" type="text" name="latitudeD"/>
                <label for="latitudeD">{{ _('Latitude Degrees') }}</label>
            </div>
            <div class="input-field col s4">
                <input id="latitudeM" type="text" name="latitudeM"/>
                <label for="latitudeM">{{ _('Latitude Minutes') }}</label>
            </div>
            <div class="input-field col s4">
                <input id="latitudeS" type="text" name="latitudeS"/>
                <label for="latitudeS">{{ _('Latitude Seconds') }}</label>
            </div>
            <div class="input-field col s4">
                <input id="longitudeD" type="text" name="longitudeD"/>
                <label for="longitudeD">{{ _('Longitude Degrees') }}</label>
            </div>
            <div class="input-field col s4">
                <input id="longitudeM" type="text" name="longitudeM"/>
                <label for="longitudeM">{{ _('Longitude Minutes') }}</label>
            </div>
            <div class="input-field col s4">
                <input id="longitudeS" type="text" name="longitudeS"/>
                <label for="longitudeS">{{ _('Longitude Seconds') }}</label>
            </div>
        </div>
        <div class="row">
            <div class="input-field col s8">
                <input id="altitude" type="text" inputmode="decimal" name="altitude" value="{% if altitude is not none %}{{ altitude }}{% endif %}"/>
                <label for="altitude">{{ _('Altitude in meter') }}</label>
                <span class="helper-text"></span>
            </div>
            </div>
        <div class="row">
            <div class="input-field col s4">
                <input id="date" type="date" name="date"/>
                <label for="date">{{ _('Date') }}</label>
            </div>
            <div class="input-field col s4">
                <input id="time" type="text" name="time"/>
                <label for="time">{{ _('UTC Time (h:m:s)') }}</label>
            </div>
            <div class="input-field col s8">
                 <button type="button" class="waves-effect waves-light btn" onclick="setBrowserDateTime()">{{ _('Set to Browser Date/Time') }}</button>
            </div>
        </div>
        <div class="row">
            <div class="col s12">
                <button type="submit" id="saveButton" class="waves-effect waves-light btn">{{ _('Save') }}</button>
            </div>
        </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const GPS_MESSAGES = {
    required: {{ _('This field is required')|tojson }},
    number: {{ _('Must be a valid number')|tojson }},
    latitude: {{ _('Must be between -90 and 90')|tojson }},
    longitude: {{ _('Must be between -180 and 180')|tojson }},
    altitude: {{ _('Must be between -1000 and 10000 meters')|tojson }}
};
const DECIMAL_FIELDS = { latitudeDecimal: 'latitude', longitudeDecimal: 'longitude', altitude: 'altitude' };
const DMS_IDS = ["latitudeD", "latitudeM", "latitudeS", "longitudeD", "longitudeM", "longitudeS"];

function toggleFormat() {
    var checkBox = document.getElementById("formatSwitch");
    var decimalFormat = document.getElementById("decimalFormat");
    var dmsFormat = document.getElementById("dmsFormat");
    if (checkBox.checked) {
        decimalFormat.style.display = "none";
        dmsFormat.style.display = "block";
        convertDecimalToDMS();
        document.getElementById("latitudeD").focus();
    } else {
        decimalFormat.style.display = "block";
        dmsFormat.style.display = "none";
    }
}

function setBrowserDateTime() {
    var now = new Date();
    var pad = function (n) { return String(n).padStart(2, "0"); };
    document.getElementById("date").value = now.toISOString().split('T')[0];
    document.getElementById("time").value = pad(now.getUTCHours()) + ":" + pad(now.getUTCMinutes()) + ":" + pad(now.getUTCSeconds());
}

function showFieldError(field, fieldName) {
    var helper = field.parentElement.querySelector('.helper-text');
    var value = normalizeDecimal(field.value);
    var valid = validateField(value, fieldName);
    field.classList.toggle('invalid', !valid);
    helper.classList.toggle('red-text', !valid);
    if (valid) {
        helper.textContent = '';
    } else if (value === '') {
        helper.textContent = GPS_MESSAGES.required;
    } else if (isNaN(parseFloat(value))) {
        helper.textContent = GPS_MESSAGES.number;
    } else {
        helper.textContent = GPS_MESSAGES[fieldName];
    }
    return valid;
}

function checkFields() {
    var allValid = true;
    Object.keys(DECIMAL_FIELDS).forEach(function (id) {
        var field = document.getElementById(id);
        if (!showFieldError(field, DECIMAL_FIELDS[id])) allValid = false;
    });
    document.getElementById('saveButton').disabled = !allValid;
    return allValid;
}

function setDMS(prefix, decimal) {
    var dms = decimalToDMS(parseFloat(normalizeDecimal(decimal)));
    document.getElementById(prefix + "D").value = dms[0];
    document.getElementById(prefix + "M").value = dms[1];
    document.getElementById(prefix + "S").value = dms[2];
}

function updateDMSFields(decimalLatitude, decimalLongitude) {
    if (decimalLatitude !== null && normalizeDecimal(decimalLatitude) !== '') setDMS("latitude", decimalLatitude);
    if (decimalLongitude !== null && normalizeDecimal(decimalLongitude) !== '') setDMS("longitude", decimalLongitude);
}

function convertDecimalToDMS() {
    updateDMSFields(document.getElementById("latitudeDecimal").value, document.getElementById("longitudeDecimal").value);
}

function updateDecimal(prefix, targetId) {
    var decimal = DMSToDecimal(
        document.getElementById(prefix + "D").value,
        document.getElementById(prefix + "M").value,
        document.getElementById(prefix + "S").value
    );
    document.getElementById(targetId).value = decimal.toFixed(6);
    checkFields();
}

document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('latitudeDecimal').addEventListener('input', function () {
        updateDMSFields(this.value, null);
        checkFields();
    });
    document.getElementById('longitudeDecimal').addEventListener('input', function () {
        updateDMSFields(null, this.value);
        checkFields();
    });
    document.getElementById('altitude').addEventListener('input', checkFields);
    ["latitudeD", "latitudeM", "latitudeS"].forEach(function (id) {
        document.getElementById(id).addEventListener("input", function () { updateDecimal("latitude", "latitudeDecimal"); });
    });
    ["longitudeD", "longitudeM", "longitudeS"].forEach(function (id) {
        document.getElementById(id).addEventListener("input", function () { updateDecimal("longitude", "longitudeDecimal"); });
    });

    document.getElementById('gps_form').addEventListener('submit', function (e) {
        Object.keys(DECIMAL_FIELDS).forEach(function (id) {
            var el = document.getElementById(id);
            el.value = normalizeDecimal(el.value);
        });
        if (!checkFields()) {
            e.preventDefault();
            M.toast({html: {{ _('Please fix the validation errors before saving')|tojson }}, classes: 'red'});
        }
    });

    checkFields();
    setBrowserDateTime();
    convertDecimalToDMS();
});
</script>
{% endblock %}
